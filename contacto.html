<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Laura Delgado</title>

    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Cardo:ital,wght@0,400;0,700;1,400&family=Creepster&family=Simonetta:ital,wght@0,400;0,900;1,400;1,900&display=swap"
        rel="stylesheet">

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="contacto.css">
</head>

<body>

    <div class="contacto-container">

        <!-- Header -->
        <header class="header-container">

            <img src="Imagenes/headercontacto.png" class="headercontacto-img" alt="Header">

            <a href="sobremi.html" class="tab-link sobre-mi"></a>
            <a href="proyectos.html" class="tab-link proyectos"></a>
            <a href="contacto.html" class="tab-link contacto"></a>

        </header>

        <!-- Carpeta -->
        <div class="folder-container">

            <img src="Imagenes/portadacontacto.png" class="folder-img" alt="Portada del contacto">

            <section class="contact-hero">

                <h1 class="contact-title">
                    ¡Trabajemos juntos!
                </h1>

                <!-- Imagen del formulario -->
                <div class="formulario-wrapper">

                    <img src="Imagenes/marcocontacto.png" class="formulario-bg" alt="Formulario">

                    <div class="contact-form">

                        <form id="contactForm" action="https://formsubmit.co/tatianagd200113@gmail.com" method="POST">

                            <input type="hidden" name="_captcha" value="false">
                            <input type="hidden" name="_template" value="table">

                            <!-- Redirección después de enviar -->
                            <input type="hidden" name="_next" value="http://127.0.0.1:5500/contacto.html">

                            <input type="text" name="name" placeholder="Nombre" required>

                            <input type="email" name="email" placeholder="Correo" required>

                            <textarea name="message" placeholder="Escribe tu mensaje" required></textarea>

                            <button type="submit" class="submit-btn">

                                <img src="Imagenes/enviar.png" alt="Enviar" class="submit-img">

                            </button>

                            <p id="mensajeEnviado" style="display:none; color:#C99C45; font-weight:bold;">
                                📸 ¡Mensaje enviado!
                            </p>



                        </form>


                    </div>

                </div>

                <!-- Tarjetas inferiores -->
                <div class="contact-info">

                    <div class="info-item">
                        <img src="Imagenes/correo.png" class="info-email" alt="Email">

                        <h3 class="info-text">
                            tatianagd200113@gmail.com
                        </h3>
                    </div>

                    <div class="info-item">
                        <img src="Imagenes/celular.png" class="info-phone" alt="Teléfono">

                        <h3 class="info-text">
                            +57 3xx xxx xxx
                        </h3>
                    </div>

                    <div class="info-item">
                        <img src="Imagenes/insta.png" class="info-instagram" alt="Instagram">

                        <h3 class="info-text">
                            @lauradeg_
                        </h3>
                    </div>

                </div>

            </section>

            <!-- Decoraciones -->
            <div class="decoraciones-container">
                <img src="Imagenes/brillo1.png" class="doodle brillo1">
                <img src="Imagenes/brillo1.png" class="doodle brillo3">
                <img src="Imagenes/brillo2.png" class="doodle brillo2">
                <img src="Imagenes/brillo2.png" class="doodle brillo4">
                <img src="Imagenes/camara.png" class="doodle camara">
                <img src="Imagenes/compu.png" class="doodle compu">
                <img src="Imagenes/garabato.png" class="doodle garabato">
                <img src="Imagenes/tableta.png" class="doodle tableta">
            </div>

        </div>



    </div>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function (e) {

            e.preventDefault();

            document.getElementById("mensajeEnviado").style.display = "block";

            setTimeout(() => {
                this.submit();
            }, 50);

        });
    </script>

</body>

</html>
